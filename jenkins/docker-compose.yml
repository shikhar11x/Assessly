# Jenkins controller, separate from the application stack.
services:
  jenkins:
    build:
      context: .
    image: assessly-jenkins:local
    container_name: assessly-jenkins
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD in jenkins/.env}
      JENKINS_URL_PUBLIC: ${JENKINS_URL_PUBLIC:-http://localhost:8091/}
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 1280m

volumes:
  jenkins_home:
